# Include this file inside the canonical sitehits.io TLS server block.
# Only the trusted loopback reverse proxy may supply forwarded headers.

location = /mcp {
    access_log off;
    # Nginx error entries include the raw request URI on upstream failures.
    # The app owns correlated/audited failures; never serialize a query bearer.
    error_log /dev/null emerg;
    proxy_pass http://127.0.0.1:8001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Request-ID $request_id;
    proxy_set_header X-SiteHits-Trusted-Proxy 1;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_read_timeout 300s;
    proxy_buffering off;
}

location ^~ /.well-known/oauth- {
    proxy_pass http://127.0.0.1:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Request-ID $request_id;
    proxy_set_header X-SiteHits-Trusted-Proxy 1;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
}

location ^~ /oauth/ {
    # Authorization requests may contain state and codes in their query string.
    access_log off;
    error_log /dev/null emerg;
    proxy_pass http://127.0.0.1:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Request-ID $request_id;
    proxy_set_header X-SiteHits-Trusted-Proxy 1;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
}

# Anonymous authorization preserves its already-validated request through the
# signup/login, Google, or magic-link chain in `next`. That query can include
# opaque OAuth state (and a magic-link hop has its own credential), so none of
# these authentication URLs may enter access logs.
location ^~ /accounts/ {
    access_log off;
    error_log /dev/null emerg;
    proxy_pass http://127.0.0.1:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Request-ID $request_id;
    proxy_set_header X-SiteHits-Trusted-Proxy 1;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
}
