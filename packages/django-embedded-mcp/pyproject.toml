[project]
name = "django-embedded-mcp"
version = "0.2.0"
description = "Reusable OAuth and MCP integration primitives for embedded Django products"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "Django>=5.2,<5.3",
  "django-oauth-toolkit>=3.4,<3.5",
  "mcp>=2.0,<2.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/django_embedded_mcp"]
