{
  "$schema": "https://json-schema.org/draft/2020-12/schema",
  "decision_record_version": 1,
  "id": "0002-mcp-oauth-v1",
  "status": "accepted",
  "date": "2026-08-12",
  "owner": "Onur",
  "agent_contract_version": "1.0.0",
  "title": "Operate and release SiteHits MCP and OAuth v1",
  "context": "Agent Contract 1.0.0 is the pinned semantic source. SiteHits has no external MCP consumer, so Stage 1 can replace provisional endpoints and legacy bearer behavior without a compatibility window.",
  "decisions": [
    {
      "id": "public-identity",
      "decision": "The production OAuth issuer is byte-exact https://sitehits.io and the canonical MCP resource is byte-exact https://sitehits.io/mcp. Issuer or resource changes require a separate migration release plan rather than an in-place version bump."
    },
    {
      "id": "client-matrix",
      "decision": "ChatGPT and Codex are the primary v1 production acceptance clients. Claude/Claude Desktop and Claude Code are required cross-agent acceptance clients. MCP Inspector is diagnostic only and cannot by itself satisfy release acceptance. The versioned policy source is integration/client-compatibility.yaml; every MCP descriptor pins its exact SHA-256 digest and seals exact client builds plus both CIMD and DCR-path results in immutable release evidence."
    },
    {
      "id": "callback-matrix",
      "decision": "ChatGPT uses its exact HTTPS callback. Claude/Claude Desktop uses exact https://claude.ai/api/mcp/auth_callback or the separately evidenced https://claude.com/api/mcp/auth_callback transition profile. DCR-native Codex may register 127.0.0.1 or [::1] HTTP loopback callbacks whose ephemeral port may vary while path and query remain exact. DCR-native Claude Code may register lowercase http://localhost:<port>/callback with a varying port and exact host/path. CIMD redirect URIs always match the fetched document exactly and do not inherit DCR port flexibility. HTTPS localhost, HTTPS non-public IP literals, uppercase LOCALHOST, 0.0.0.0, wildcard, userinfo, fragments, and unregistered paths remain unsupported."
    },
    {
      "id": "cimd-first",
      "decision": "V1 is CIMD-first for public clients and advertises client_id_metadata_document_supported=true. URL-shaped client IDs are fetched only by the versioned django-embedded-mcp adapter using HTTPS, DNS pinning, public-address validation, no redirects, bounded time/body/concurrency, validated cache lifetimes, exact document client_id binding, and fail-closed stale behavior. Django OAuth Toolkit remains the grant/token core; its independent CIMD resolver is disabled so it cannot create a second policy path."
    },
    {
      "id": "dcr-fallback-lifecycle",
      "decision": "Anonymous DCR remains a compatibility fallback with mandatory web/native application_type, persistent abuse limits, credential-free registration/use telemetry, and no RFC 7592 management endpoint or registration access token. The repository-maintainer role owns it. Review occurs at least every 90 days and before MCP authorization-spec changes, required-client registration/callback changes, public plugin submission, or an OAuth security incident. Removal requires every supported primary/cross-agent client to pass current non-DCR acceptance, no supported matrix entry to require DCR, and 90 consecutive production days with zero successful DCR use; any use or compatibility regression resets the window."
    },
    {
      "id": "runtime-topology",
      "decision": "Production uses PostgreSQL 17. The existing Django web socket and the dedicated MCP process run from the same exact native Git checkout and Python virtualenv, are managed by systemd behind the same-origin reverse proxy, and share the product account model, database, settings, and service layer."
    },
    {
      "id": "persistent-operations",
      "decision": "Registration and OAuth abuse limits are database-backed; local-memory rate limiting is forbidden. Credential and stale-client cleanup runs at least daily through a systemd timer and emits bounded-job metrics suitable for alerting."
    },
    {
      "id": "retention",
      "decision": "Agent and OAuth audit records are retained for 90 days. Terminal or expired OAuth credential metadata and stale DCR client metadata are retained for 30 days, after which daily bounded cleanup may delete them. Raw credentials are never retained as audit evidence."
    },
    {
      "id": "immutable-release",
      "decision": "The server runtime is the exact native Git checkout identified by full git_commit, source-tree digest, dependency-lock digest, and checked-in deploy-contract digest. The MCP descriptor and immutable ChatGPT-plus-Codex-plus-Claude-plus-Claude-Code smoke bundle are GitHub Release assets. Downstream consumers resolve these immutable identities and never depend on a container image or mutable branch."
    },
    {
      "id": "clean-cut-rollout",
      "decision": "There are no external consumers and no legacy compatibility window. The production cutover removes provisional endpoints and legacy token behavior. Rollback may restore only a prior compatible exact commit, dependency lock, deploy config and descriptor and must never reactivate revoked tokens or consumed codes."
    }
  ],
  "migration_plan": [
    "Take a PostgreSQL 17 backup and record the pinned Agent Contract descriptor digest.",
    "Apply additive OAuth, audit, rate-limit, cleanup-index, and constraint migrations before routing traffic to the new MCP process.",
    "Drain and stop every old web/MCP writer before refresh-family migrations 0002 through 0004; this clean-cut release does not claim zero-downtime migration.",
    "Run code-exchange, refresh-family, revoke, quota, and cleanup concurrency suites against PostgreSQL 17 rather than SQLite.",
    "Run local conformance first, then deploy the exact native source candidate directly to production; execute ChatGPT, Codex, Claude/Claude Desktop, and Claude Code acceptance over CIMD plus separately evidenced DCR fallback, then run Inspector diagnostics.",
    "Seal release/mcp-release.json only after exact source, dependency lock, deploy contract, registry, smoke, audit, refresh, revoke, cleanup, and rollback evidence exists."
  ],
  "rollback_plan": [
    "Keep the previous exact commit, dependency lock, configuration, deploy contract, descriptor, and database backup available until the post-deploy rollback smoke is green.",
    "If additive schema remains backward-compatible, restore the previous native checkout/config and repeat discovery, exact-resource, OAuth, initialize, bootstrap, audit, refresh, and revoke smoke.",
    "If schema is not backward-compatible, do not downgrade code or reverse state transitions; disable new traffic if necessary and roll forward a corrective native release.",
    "A rollback must preserve revocations, consumed authorization codes, refresh-family replay decisions, audit records, and cleanup evidence."
  ],
  "consequences": [
    "Stage 1 is not releasable from repository artifacts alone; production PostgreSQL, native deployment, real-client, GitHub Release, cleanup-health, and rollback evidence are mandatory.",
    "A stale or unreachable CIMD document makes that client temporarily unusable; the last good document remains stored for audit but is never silently authorized after expiry.",
    "DCR remains operational until its role-owned 90-day removal evidence is complete; CIMD-first does not authorize early fallback removal.",
    "MCP server SemVer remains independent of the Agent Contract version; no mcp_contract_version is introduced.",
    "Standalone Skill work may begin only after a sealed MCP descriptor and immutable Stage 1 acceptance evidence exist."
  ]
}
