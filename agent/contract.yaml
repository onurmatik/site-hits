        "limits": {"type": "array", "minItems": 1, "maxItems": 1, "items": {"$ref": "#/$defs/limit_status"}}
      },
      "additionalProperties": false
    },
    "list_sites_input": {"type": "object", "properties": {"include_inactive": {"type": "boolean", "default": false}}, "additionalProperties": false},
    "site_lookup_input": {"type": "object", "required": ["site_slug"], "properties": {"site_slug": {"$ref": "#/$defs/site_slug"}}, "additionalProperties": false},
    "create_site_input": {
      "type": "object",
      "required": ["name", "allowed_domains", "idempotency_key"],
      "properties": {
        "name": {"type": "string", "minLength": 1, "maxLength": 120},
        "allowed_domains": {"type": "array", "minItems": 1, "items": {"type": "string", "minLength": 1, "maxLength": 255}, "uniqueItems": true},
        "timezone": {"type": "string", "minLength": 1, "maxLength": 64, "default": "Europe/Istanbul"},
        "idempotency_key": {"type": "string", "minLength": 8, "maxLength": 128}
      },
      "additionalProperties": false
    },
    "update_site_input": {
      "type": "object",
      "required": ["site_slug", "expected_revision"],
      "properties": {
        "site_slug": {"$ref": "#/$defs/site_slug"},
        "expected_revision": {"$ref": "#/$defs/revision"},
        "name": {"type": "string", "minLength": 1, "maxLength": 120},
        "allowed_domains": {"type": "array", "minItems": 1, "items": {"type": "string", "minLength": 1, "maxLength": 255}, "uniqueItems": true},
        "timezone": {"type": "string", "minLength": 1, "maxLength": 64},
        "is_active": {"type": "boolean"}
      },
      "anyOf": [{"required": ["name"]}, {"required": ["allowed_domains"]}, {"required": ["timezone"]}, {"required": ["is_active"]}],
      "additionalProperties": false
    },
    "delete_site_input": {
      "type": "object",
      "required": ["site_slug", "expected_revision"],
      "properties": {"site_slug": {"$ref": "#/$defs/site_slug"}, "expected_revision": {"$ref": "#/$defs/revision"}, "approval": {"$ref": "#/$defs/approval_delete_site"}},
      "additionalProperties": false
    },
    "site_delete_result": {"type": "object", "required": ["deleted", "site_slug"], "properties": {"deleted": {"const": true}, "site_slug": {"$ref": "#/$defs/site_slug"}}, "additionalProperties": false},
    "period_only_input": {"type": "object", "properties": {"period": {"$ref": "#/$defs/period", "default": "last7d"}}, "additionalProperties": false},
    "analytics_period_input": {"type": "object", "properties": {"site_slug": {"$ref": "#/$defs/site_selector", "default": "all"}, "period": {"$ref": "#/$defs/period", "default": "last7d"}}, "additionalProperties": false},
    "timeseries_input": {"type": "object", "properties": {"site_slug": {"$ref": "#/$defs/site_selector", "default": "all"}, "period": {"$ref": "#/$defs/period", "default": "last7d"}, "granularity": {"type": "string", "enum": ["auto", "hourly", "daily"], "default": "auto"}}, "additionalProperties": false},
    "breakdown_input": {"type": "object", "required": ["site_slug", "dimension"], "properties": {"site_slug": {"$ref": "#/$defs/site_slug"}, "dimension": {"type": "string", "enum": ["pages", "referrers", "countries", "regions", "cities", "devices", "browsers", "os", "campaigns", "events"]}, "period": {"$ref": "#/$defs/period", "default": "last7d"}, "limit": {"type": "integer", "minimum": 1, "maximum": 50, "default": 8}}, "additionalProperties": false},
    "bot_analytics_input": {"type": "object", "properties": {"site_slug": {"$ref": "#/$defs/site_selector", "default": "all"}, "period": {"$ref": "#/$defs/period", "default": "last7d"}, "limit": {"type": "integer", "minimum": 1, "maximum": 50, "default": 8}}, "additionalProperties": false},
    "product_metrics_input": {"type": "object", "required": ["site_slug"], "properties": {"site_slug": {"$ref": "#/$defs/selected_site_slug"}, "period": {"$ref": "#/$defs/period", "default": "last7d"}}, "additionalProperties": false},
    "freshness": {"type": "object", "required": ["source", "generated_at", "is_stale"], "properties": {"source": {"type": "string", "enum": ["hot", "hybrid", "cache"]}, "generated_at": {"type": "string", "format": "date-time"}, "is_stale": {"type": "boolean"}}, "additionalProperties": false},
    "metric_set": {"type": "object", "required": ["visitors", "sessions", "pageviews", "bounce_rate", "avg_session_duration"], "properties": {"visitors": {"type": "integer", "minimum": 0}, "sessions": {"type": "integer", "minimum": 0}, "pageviews": {"type": "integer", "minimum": 0}, "bounce_rate": {"type": "number", "minimum": 0, "maximum": 100}, "avg_session_duration": {"type": "integer", "minimum": 0}}, "additionalProperties": false},
    "metric_deltas": {"type": "object", "required": ["visitors", "sessions", "pageviews", "bounce_rate", "avg_session_duration"], "properties": {"visitors": {"type": ["number", "null"]}, "sessions": {"type": ["number", "null"]}, "pageviews": {"type": ["number", "null"]}, "bounce_rate": {"type": ["number", "null"]}, "avg_session_duration": {"type": ["number", "null"]}}, "additionalProperties": false},
    "analytics_overview": {"type": "object", "required": ["site", "period", "timezone", "current", "previous", "deltas"], "properties": {"site": {"$ref": "#/$defs/site_selector"}, "period": {"$ref": "#/$defs/period"}, "timezone": {"type": "string"}, "current": {"$ref": "#/$defs/metric_set"}, "previous": {"$ref": "#/$defs/metric_set"}, "deltas": {"$ref": "#/$defs/metric_deltas"}, "freshness": {"$ref": "#/$defs/freshness"}}, "additionalProperties": false},
