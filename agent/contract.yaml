  "$defs": {
    "empty_object": {"type": "object", "properties": {}, "additionalProperties": false},
    "site_slug": {"type": "string", "pattern": "^[a-z0-9]+(?:-[a-z0-9]+)*$", "minLength": 1, "maxLength": 80},
    "selected_site_slug": {"allOf": [{"$ref": "#/$defs/site_slug"}, {"not": {"const": "all"}}]},
    "site_selector": {"type": "string", "pattern": "^(?:all|[a-z0-9]+(?:-[a-z0-9]+)*)$", "minLength": 1, "maxLength": 80},
    "event_name": {"type": "string", "pattern": "^[a-z0-9][a-z0-9_:-]{0,63}$"},
    "revision": {"type": "string", "minLength": 1, "maxLength": 64},
    "period": {"type": "string", "enum": ["today", "last24h", "last7d", "last30d", "last90d", "last180d", "last365d"]},
    "aggregation": {"type": "string", "enum": ["count", "unique_actors", "sum", "average"]},
    "application_error": {
      "type": "object",
      "required": ["code", "message", "retryable", "request_id", "details"],
      "properties": {
        "code": {"type": "string", "enum": ["invalid_input", "resource_not_found", "permission_denied", "confirmation_required", "revision_conflict", "idempotency_conflict", "referenced_resource_conflict", "capacity_reached", "rate_limited", "feature_unavailable", "historical_data_unavailable", "internal_error"]},
        "message": {"type": "string", "minLength": 1},
        "retryable": {"type": "boolean"},
        "request_id": {"type": "string", "pattern": "^[A-Za-z0-9_-]{1,64}$"},
        "details": {"type": "object", "additionalProperties": true}
      },
      "additionalProperties": false
    },
    "approval_delete_site": {
      "type": "object",
      "required": ["owner", "action", "resource_id", "confirmed"],
      "properties": {"owner": {"const": "agent"}, "action": {"const": "delete_site"}, "resource_id": {"$ref": "#/$defs/site_slug"}, "confirmed": {"const": true}},
      "additionalProperties": false
    },
    "approval_delete_measurement_event": {
      "type": "object",
      "required": ["owner", "action", "resource_id", "confirmed"],
      "properties": {"owner": {"const": "agent"}, "action": {"const": "delete_measurement_event"}, "resource_id": {"type": "string", "pattern": "^[a-z0-9]+(?:-[a-z0-9]+)*/[a-z0-9][a-z0-9_:-]{0,63}$"}, "confirmed": {"const": true}},
      "additionalProperties": false
    },
    "approval_change_measurement_event_contract": {
      "type": "object",
      "required": ["owner", "action", "resource_id", "confirmed"],
      "properties": {"owner": {"const": "agent"}, "action": {"const": "change_measurement_event_contract"}, "resource_id": {"type": "string", "pattern": "^[a-z0-9]+(?:-[a-z0-9]+)*/[a-z0-9][a-z0-9_:-]{0,63}$"}, "confirmed": {"const": true}},
      "additionalProperties": false
    },
    "approval_clear_activation": {
      "type": "object",
      "required": ["owner", "action", "resource_id", "confirmed"],
      "properties": {"owner": {"const": "agent"}, "action": {"const": "clear_activation"}, "resource_id": {"$ref": "#/$defs/site_slug"}, "confirmed": {"const": true}},
      "additionalProperties": false
    },
    "site": {
      "type": "object",
      "required": ["slug", "name", "allowed_domains", "timezone", "is_active", "created_at", "updated_at", "revision"],
      "properties": {
        "slug": {"$ref": "#/$defs/site_slug"},
        "name": {"type": "string", "minLength": 1, "maxLength": 120},
        "allowed_domains": {"type": "array", "minItems": 1, "items": {"type": "string", "minLength": 1, "maxLength": 255}, "uniqueItems": true},
        "timezone": {"type": "string", "minLength": 1, "maxLength": 64},
        "is_active": {"type": "boolean"},
        "created_at": {"type": "string", "format": "date-time"},
        "updated_at": {"type": "string", "format": "date-time"},
        "revision": {"$ref": "#/$defs/revision"}
      },
      "additionalProperties": false
    },
    "site_list": {"type": "object", "required": ["sites"], "properties": {"sites": {"type": "array", "items": {"$ref": "#/$defs/site"}}}, "additionalProperties": false},
    "capability_status": {"type": "object", "required": ["name", "available"], "properties": {"name": {"type": "string", "enum": ["site_management", "traffic_analytics", "bot_analytics", "product_measurement", "tracking_setup", "global_resource_access"]}, "available": {"type": "boolean"}}, "additionalProperties": false},
    "limit_status": {"type": "object", "required": ["name", "used", "limit", "period", "reset_at"], "properties": {"name": {"const": "sites"}, "used": {"type": "integer", "minimum": 0}, "limit": {"type": ["integer", "null"], "minimum": 0}, "period": {"const": "permanent"}, "reset_at": {"type": "null"}}, "additionalProperties": false},
    "account_capabilities": {
      "type": "object",
      "required": ["capabilities", "limits"],
